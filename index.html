<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bac Info Platform</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
      margin-top: 40px;
    }
    .card {
      background-color: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 30px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1>Bac Info Platform</h1>
  </header>

  <div class="content-area">
    <div class="grid-container">
      <a href="math.html" class="card">
        <h2>Mathématiques</h2>
      </a>
      <a href="physique.html" class="card">
        <h2>Physique & Chimie</h2>
      </a>
      <a href="prog.html" class="card">
        <h2>Algo & Prog</h2>
      </a>
      <a href="sti-omar.html" class="card">
        <h2>STI (Mr Omar)</h2>
      </a>
      <a href="sti-salma.html" class="card">
        <h2>STI (Mme Salma)</h2>
      </a>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateforme Bac Info</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Modal d'accès -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>Accès à la Plateforme</h2>
            <form id="loginForm">
                <input type="text" id="userName" placeholder="Nom et Prénom" required>
                <input type="email" id="userEmail" placeholder="Adresse Email" required>
                <button type="submit">Demander l'accès</button>
            </form>

            <form id="codeForm" style="display: none;">
                <p id="codeInfoText"></p>
                <input type="text" id="verificationCodeInput" placeholder="Entrez le code" required>
                <button type="submit">Valider le code</button>
            </form>
        </div>
    </div>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>Bac-Info 3al-Tayer ✨ </h3>
                <span id="accessStatus" class="status-locked">🔒 Accès Restreint</span>
            </div>
            <div id="subjectTree" class="tree-container"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h2 id="videoTitle">Sélectionnez une séance</h2>
            
            <div class="player-wrapper">
                <div id="player"></div>
                <!-- Layer kamel fou9 el iframe bech yemna3 el click el direct -->
                <div id="videoOverlay" class="video-overlay"></div>
            </div>

            <!-- Interactive Seek Bar -->
            <div class="progress-container">
                <div class="progress-info">
                    <span>Progression de la vidéo :</span>
                    <span id="progressText">0%</span>
                </div>
                <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1">
            </div>

            <!-- Custom Controls Bar -->
            <div class="controls-bar">
                <button id="rewindBtn">⏮ -10s</button>
                <button id="playPauseBtn">▶ / ⏸</button>
                <button id="forwardBtn">+10s ⏭</button>
                <button id="speedBtn" class="control-btn">⚡ 1x</button>
                <button id="fullscreenBtn" class="control-btn">⛶ Plein Écran</button>
                
                <span id="playerStatus">⏸ En pause</span>
                <button onclick="notifyPdfDownload()" class="pdf-btn">📄 Support PDF</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

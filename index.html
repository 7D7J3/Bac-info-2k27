<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learning Portal | IT & Tech</title>
    <!-- v=2.0 باش نتفاداو الـ Cache متاع GitHub -->
    <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">⚡ IT Platform</div>
        <div id="accountStatus" class="status-locked">المنصة مقفولة</div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h3>المحتوى التعليمي</h3>
            
            <div class="accordion-item">
                <div class="accordion-title">Chapitre 1: Introduction</div>
                <div class="accordion-content active">
                    <div class="chapter-heading">الدروس</div>
                    <a class="video-link" data-video-id="dQw4w9WgXcQ">
                        <span>1.1 Introduction IT</span>
                        <span class="badge-status badge-red" id="badge-dQw4w9WgXcQ">0%</span>
                    </a>
                </div>
            </div>
        </aside>

        <!-- Main Content / Player Area -->
        <main class="content-area">
            <div class="video-player-card">
                <h2 id="videoTitle">مشاهدة الفيديو</h2>
                
                <!-- Player Box -->
                <div class="video-container">
                    <div id="player"></div>
                </div>

                <!-- Single Video Progress Bar -->
                <div class="single-video-progress">
                    <div class="progress-info">
                        <span>نسبة تقدم الفيديو الحالي:</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="progressBarFill" class="progress-bar-fill level-red"></div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="custom-controls">
                    <button class="btn-ctrl" onclick="playVideo()">تشغيل</button>
                    <button class="btn-ctrl" onclick="pauseVideo()">إيقاف مؤقت</button>
                    <span class="ctrl-status" id="videoStateStatus">الحالة: متوقف</span>
                </div>
            </div>
        </main>
    </div>

    <!-- YouTube API & Custom JS -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js?v=2.0"></script>
</body>
</html>

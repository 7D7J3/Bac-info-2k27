<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateforme Bac Info - Tunisie</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">
            <h1>BAC INFO <span>TUNISIE</span></h1>
        </div>
        <div class="user-status-container">
            <span id="accessStatus" class="status-locked">🔒 Accès Non Autorisé</span>
        </div>
    </header>

    <!-- Modal Formulaire Login / Demande d'accès -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2>Espace Élève - Bac Info</h2>
            <p>Veuillez remplir vos informations pour débloquer l'accès immédiat aux cours.</p>
            
            <form action="https://api.web3forms.com/submit" method="POST" id="loginForm">
                <input type="hidden" name="access_key" value="d55f35a8-f325-4d2c-88e4-26ccd4c04cf7">
                <input type="hidden" name="subject" value="Nouvelle Demande d'Accès Bac Info">

                <div class="form-group">
                    <label for="fullName">Nom et Prénom :</label>
                    <input type="text" id="fullName" name="name" placeholder="Ex: Mohamed Ben Salah" required>
                </div>

                <div class="form-group">
                    <label for="userEmail">Email :</label>
                    <input type="email" id="userEmail" name="email" placeholder="Ex: exemple@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="userMessage">Niveau / Remarque :</label>
                    <textarea id="userMessage" name="message" placeholder="Je souhaite accéder aux cours de Bac Info..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Débloquer l'Accès Maintenant 🚀</button>
            </form>
            <p class="note">* L'accès sera débloqué instantanément après l'envoi.</p>
        </div>
    </div>

    <!-- Interface Principale des Cours -->
    <div class="container main-layout">
        
        <!-- Sidebar : Navigation par Matières et Chapitres -->
        <aside class="sidebar">
            <h3>📚 Matières & Chapitres</h3>
            <div class="accordion" id="subjectTree">
                <!-- Généré dynamiquement par JS -->
            </div>
        </aside>

        <!-- Main Content : Lecteur Vidéo & PDF -->
        <main class="content-area">
            <div class="video-player-card">
                <h2 id="videoTitle">Sélectionnez une vidéo dans le menu à gauche 👈</h2>
                
                <div class="video-container">
                    <iframe id="mainIframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>

                <div class="actions-bar">
                    <button class="btn-pdf" id="downloadPdfBtn" onclick="notifyPdfDownload()">📄 Télécharger Support PDF</button>
                </div>
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateforme Bac Info</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Modal d'accès -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>🔒 Accès à la Plateforme</h2>
            <p>Veuillez entrer vos informations pour accéder aux cours.</p>
            <form id="loginForm">
                <input type="text" placeholder="Nom & Prénom" required>
                <input type="email" placeholder="Adresse Email" required>
                <button type="submit" class="btn-submit">Valider & Accéder</button>
            </form>
        </div>
    </div>

    <!-- Header -->
    <header class="navbar">
        <div class="logo">🎓 Bac Info Platform</div>
        <div id="accessStatus" class="status-locked">🔒 Accès Restreint</div>
    </header>

    <!-- App Layout -->
    <div class="main-container">
        
        <!-- Sidebar : Navigation par Matière -->
        <aside class="sidebar">
            <h3>📂 Programme Bac Info</h3>
            <div id="subjectTree" class="tree-menu">
                <!-- Généré dynamiquement par script.js -->
            </div>
        </aside>

        <!-- Main Content : Lecteur Vidéo & Protection Overlay -->
        <main class="content-area">
            <div class="video-player-card">
                <h2 id="videoTitle">Sélectionnez une vidéo dans le menu à gauche 👈</h2>
                
                <div class="video-container">
                    <!-- Iframe YouTube avec Player API -->
                    <iframe id="mainIframe" src="" frameborder="0" allow="autoplay"></iframe>
                    <!-- Shield transparent : Bloque 100% les clics vers YouTube -->
                    <div class="video-overlay" id="videoOverlay"></div>
                </div>

                <!-- Custom Controls Bar -->
                <div class="custom-controls">
                    <button id="playPauseBtn" class="btn-ctrl">▶ Play / Pause</button>
                    <span id="playerStatus" class="ctrl-status">Cliquez sur Play pour lancer</span>
                </div>

                <div class="actions-bar">
                    <button class="btn-pdf" id="downloadPdfBtn" onclick="notifyPdfDownload()">📄 Télécharger Support PDF</button>
                </div>
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>

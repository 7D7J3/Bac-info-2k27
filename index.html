<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateforme Bac Info</title>
    <link rel="stylesheet" href="style.css?v=2.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Modal d'accès & Authentification -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>🔒 Accès Sécurisé</h2>
            
            <form id="loginForm">
                <p>Entrez vos coordonnées pour demander votre code d'accès à l'administrateur.</p>
                <input type="text" id="userName" placeholder="Nom & Prénom" required>
                <input type="email" id="userEmail" placeholder="Votre Adresse Email" required>
                <button type="submit" class="btn-submit">Demander le code ✉️</button>
            </form>

            <form id="codeForm" style="display: none;">
                <p id="codeInfoText" style="color: #10b981; font-size: 0.9rem; margin-bottom: 10px;"></p>
                <input type="text" id="verificationCodeInput" placeholder="Entrez le code reçu" required>
                <button type="submit" class="btn-submit">Valider le code 🔓</button>
            </form>
        </div>
    </div>

    <!-- Header -->
    <header class="navbar">
        <div class="logo">🎓 Bac Info Platform</div>
        <div id="accessStatus" class="status-locked">🔒 Accès Restreint</div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        
        <!-- Sidebar Menu -->
        <aside class="sidebar">
            <h3>📂 Programme Bac Info</h3>
            <div id="subjectTree" class="tree-menu"></div>
        </aside>

        <!-- Video Player -->
        <main class="content-area">
            <div class="video-player-card">
                <h2 id="videoTitle">Sélectionnez une vidéo dans le menu à gauche 👈</h2>
                
                <!-- Protected Video Container -->
                <div class="video-container">
                    <div id="player"></div>
                    <div class="video-overlay" id="videoOverlay"></div>
                </div>

                <!-- Individual Video Progress Bar -->
                <div class="single-video-progress">
                    <div class="progress-info">
                        <span>Progression de cette vidéo</span>
                        <span id="currentVideoPercent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="currentVideoBar" class="progress-bar-fill level-red"></div>
                    </div>
                </div>

                <!-- Custom Controls Bar -->
                <div class="custom-controls">
                    <button id="rewindBtn" class="btn-ctrl">⏪ -10s</button>
                    <button id="playPauseBtn" class="btn-ctrl">▶ Play / Pause</button>
                    <button id="forwardBtn" class="btn-ctrl">⏩ +10s</button>
                    <span id="playerStatus" class="ctrl-status">Choisissez une vidéo pour commencer</span>
                </div>

            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
